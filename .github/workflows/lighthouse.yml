name: Lighthouse

# Separate from ci.yml so it never changes the duration or result of `verify`.
# Only the blocking groups run here; performance and best practices are
# measured locally with `npm run report:lighthouse`.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    # Required check in branch protection: renaming it breaks the rule.
    name: lighthouse (blocking)
    runs-on: ubuntu-latest
    # Grows with the catalog (2 URLs per project).
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Production build: next dev is unminified and would skew every score.
      - run: npm run build

      - name: Lighthouse (next start)
        run: |
          npx next start -p 3000 > next.log 2>&1 &
          npm run lighthouse -- http://localhost:3000 --only=blocking-mobile-light,blocking-mobile-dark,notfound-mobile || { tail -50 next.log; exit 1; }

      - name: Job summary
        if: always()
        run: cat .lighthouseci/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      # The HTML/JSON reports only matter when something has to be debugged.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lighthouse-blocking
          path: .lighthouseci/
          include-hidden-files: true
          # A failure on main needs longer to investigate than a PR iteration.
          retention-days: ${{ github.event_name == 'push' && 30 || 5 }}
