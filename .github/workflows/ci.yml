name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # .npmrc reads this to install the private design system package.
      GITHUB_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run build

      - name: Smoke test (next start)
        run: |
          npx next start -p 3000 > next.log 2>&1 &
          node scripts/smoke-test.mjs http://localhost:3000 || { cat next.log; exit 1; }

      # Threshold is critical until the Sanity 6 migration clears the highs.
      - run: npm audit --audit-level=critical
